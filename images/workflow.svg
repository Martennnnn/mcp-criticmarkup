<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB7185"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
  </defs>

  <style>
    .node-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8B949E; }
    .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
    .format-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Background Canvas Card -->
  <rect width="940" height="380" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: ITERATION LOOP ==================== -->

  <!-- TOP BOX: EDITING -->
  <g transform="translate(60, 55)">
    <rect width="260" height="74" rx="10" fill="#161B22" stroke="#FB7185" stroke-width="1.5"/>
    <g transform="translate(18, 18)" stroke="#FB7185" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </g>
    <text x="56" y="32" class="node-header" fill="#FB7185">Editing</text>
    <text x="56" y="52" class="node-sub">Human Writer (e.g. Monoleaf)</text>
  </g>

  <!-- BIDIRECTIONAL ARROWS -->

  <!-- Arrow 1: Downward (Editing -> AI Review) -->
  <path d="M 140 137 L 140 237" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <text x="128" y="191" class="arrow-text" fill="#38BDF8" text-anchor="end">Review</text>

  <!-- Arrow 2: Upward (AI Review -> Editing) -->
  <path d="M 230 243 L 230 143" fill="none" stroke="#FB7185" stroke-width="2.5" marker-end="url(#arrow-up)"/>
  <text x="242" y="191" class="arrow-text" fill="#FB7185" text-anchor="start">CriticMarkup</text>

  <!-- BOTTOM BOX: AI REVIEW -->
  <g transform="translate(60, 251)">
    <rect width="260" height="74" rx="10" fill="#161B22" stroke="#38BDF8" stroke-width="1.5"/>
    <g transform="translate(18, 18)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"/>
      <circle cx="12" cy="5" r="2"/>
      <path d="M12 7v4"/>
      <line x1="8" y1="16" x2="8.01" y2="16"/>
      <line x1="16" y1="16" x2="16.01" y2="16"/>
    </g>
    <text x="56" y="32" class="node-header" fill="#38BDF8">AI Review</text>
    <text x="56" y="52" class="node-sub">CriticMarkup MCP Server</text>
  </g>


  <!-- ==================== MIDDLE: CURLY BRACKET & EXIT ARROW ==================== -->

  <!-- Curly Bracket "}" enclosing the review loop (Centered at Y=190) -->
  <path d="M 355 55
           C 375 55, 375 75, 375 125
           L 375 168
           C 375 183, 395 190, 395 190
           C 395 190, 375 197, 375 212
           L 375 255
           C 375 305, 375 325, 355 325"
        fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Exit Arrow pointing right to Export -->
  <path d="M 395 190 L 542 190" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#arrow-right)"/>
  <text x="468" y="178" class="arrow-text" fill="#34D399" text-anchor="middle">Optionally, when finished</text>


  <!-- ==================== RIGHT COLUMN: EXPORT ==================== -->

  <g transform="translate(552, 113)">
    <rect width="280" height="154" rx="12" fill="#161B22" stroke="#34D399" stroke-width="1.5"/>

    <text x="24" y="38" class="node-header" fill="#34D399">Export</text>
    <text x="24" y="58" class="node-sub">Typst / Pandoc (e.g. via Zettlr)</text>

    <!-- Format Badges Grid -->
    <g transform="translate(24, 80)">
      <rect width="105" height="50" rx="8" fill="#0D1117" stroke="#EF4444" stroke-width="1"/>
      <text x="52" y="26" text-anchor="middle" class="format-label" fill="#EF4444">PDF</text>
      <path d="M 38 36 L 66 36" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(145, 80)">
      <rect width="105" height="50" rx="8" fill="#0D1117" stroke="#F97316" stroke-width="1"/>
      <text x="52" y="26" text-anchor="middle" class="format-label" fill="#F97316">HTML</text>
      <text x="52" y="38" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B949E">&lt;/&gt;</text>
    </g>
  </g>

</svg>
