[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-criticmarkup"
version = "0.2.0"
description = "CriticMarkup track-changes and threaded comments for Markdown via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-criticmarkup = "server.server:main"

[tool.setuptools.packages.find]
include = ["server*"]
